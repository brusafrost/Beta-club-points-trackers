name: Deploy to Surge

on:
  push:
    branches:
      - main
      - master
      - release/**
      - brusafrost-fix-surge-sh
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          set -e
          echo "Installing dependencies (npm ci). If it fails, retry with npm install --no-optional and rebuild native modules."
          npm ci || (echo "npm ci failed — retrying with npm install --no-optional" && npm install --no-optional)
          echo "Attempting to rebuild native modules (if any)"
          npm rebuild --update-binary || true
        working-directory: .

      - name: Build
        run: npm run build
        working-directory: .

      - name: Make deploy script executable
        run: chmod +x ./surge.sh

      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          BUILD_DIR: ./dist
          SURGE_DOMAIN: betaclub-gcps-live.surge.sh
        run: ./surge.sh
