name: Deploy to Surge

on:
  push:
    branches:
      - main
      - master
      - release/**
      - brusafrost-fix-surge-sh
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Enable corepack & pnpm
        run: |
          set -e
          echo "Enabling corepack and activating pnpm"
          corepack enable
          corepack prepare pnpm@latest --activate
          echo "pnpm version:"
          pnpm -v

      - name: Install dependencies
        run: |
          set -e
          echo "Enable corepack and install with pnpm"
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v
          if test -f pnpm-lock.yaml; then
            echo "Found pnpm-lock.yaml — installing with frozen lockfile"
            pnpm install --frozen-lockfile
          else
            echo "No pnpm-lock.yaml — installing with pnpm"
            pnpm install
          fi
        working-directory: .

      - name: Build
        run: |
          set -e
          echo "Building with pnpm"
          pnpm build
        working-directory: .

      - name: Make deploy script executable
        run: chmod +x ./surge.sh

      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          BUILD_DIR: ./dist
          SURGE_DOMAIN: betaclub-gcps-live.surge.sh
        run: ./surge.sh
